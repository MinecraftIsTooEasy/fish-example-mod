plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// Replace "Country" with an ISO country code, for example: "CN".
def useLocalizedArchiveName = Locale.default.country.equalsIgnoreCase("Country")

base {
    // Replace "LocalizedArchiveName" with the localized alias.
    // Prefix local JAR names with an optional alias, for example: "[Alias]" + archives_base_name.
    // Maven publishing keeps using the lowercase maven_id configured below.
    archivesName = useLocalizedArchiveName
            ? "[LocalizedArchiveName]${project.archives_base_name}"
            : project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // Only declare repositories required by this project because Loom provides
    // the repositories needed for Minecraft and its libraries automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repository declarations.
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }// Dependency library(FastUtil, Gson, etc) download source
    maven {
        name = "ModdedMITE"
        url = "https://maven.limingzxc.top/repository/maven-public/"
    }// Mods & Loaders download source
}

configurations {
    fml
}

dependencies {
    // Dependency versions are maintained in gradle.properties or alongside project-specific declarations below.
    // Use implementation for required mods, compileOnly for optional integrations,
    // and localRuntime for mods needed only in the development environment.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation("it.unimi.dsi:fastutil:8.5.12")
    implementation("com.google.code.gson:gson:2.11.0")

    fml "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:3.4.2"

    // The most basic dependency library mod, with a status similar to Fabric API
    implementation "com.github.MinecraftIsTooEasy:RustedIronCore:1.5.5"

    // To add strong dependencies, use "implementation" like above
    // To compile mod integrations(e.g. ModMenu), use "compileOnly"
    // To add mods for running client, use "localRuntime"
}

// Minecraft 1.6.4 pins LWJGL 2.9.1, whose macOS natives are x86_64 only and whose window
// creation no longer works on current macOS: the process stays registered as BackgroundOnly,
// so the render loop runs but no window is ever shown. Prism Launcher solves this for legacy
// versions by moving to LWJGL 2.9.4 plus community-built arm64 natives, and the same
// substitution is applied here. Set skip_arm64_lwjgl=true in gradle.properties to opt out.
// This has to be declared before any configuration is resolved.
def onAppleSilicon = System.getProperty("os.name").startsWith("Mac")
        && System.getProperty("os.arch") == "aarch64"
def useArm64Lwjgl = onAppleSilicon
        && !Boolean.parseBoolean(String.valueOf(project.findProperty("skip_arm64_lwjgl")))

if (useArm64Lwjgl) {
    configurations.all {
        resolutionStrategy.eachDependency {
            // The arm64 natives keep their own version: it is the release tag the repository
            // below builds its URLs from, so rewriting it would break resolution.
            if (it.requested.group == "org.lwjgl.lwjgl"
                    && it.requested.name != "lwjgl-platform-arm64") {
                it.useVersion "2.9.4-nightly-20150209"
                it.because "LWJGL 2.9.1 ships no macOS arm64 natives"
            }
        }
    }

    // Mojang only ships x86_64 macOS natives for LWJGL 2, so the arm64 build comes from the
    // MinecraftMachina release Prism Launcher also uses. It is published as a GitHub release
    // asset rather than to a Maven repository, hence the pattern layout.
    repositories {
        ivy {
            name = "MinecraftMachinaLWJGL"
            url = "https://github.com/MinecraftMachina/lwjgl/releases/download/"
            patternLayout {
                artifact "[revision]/lwjgl-platform-2.9.4-nightly-20150209-natives-osx.[ext]"
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule("org.lwjgl.lwjgl", "lwjgl-platform-arm64")
            }
        }
    }

    // Swap the natives Loom resolved from the version manifest for the arm64 build and let
    // its own extractNatives task unpack them.
    configurations.matching { it.name == "minecraftNatives" }.configureEach {
        exclude group: "org.lwjgl.lwjgl", module: "lwjgl-platform"
    }

    dependencies {
        minecraftNatives "org.lwjgl.lwjgl:lwjgl-platform-arm64:2.9.4-20150209-mmachina.2"
    }
}

def fmlResolvedFile = configurations.fml.singleFile

loom {
    accessWidenerPath = file("src/main/resources/modid.accesswidener")
    mergedMinecraftJar()
    setFML(fmlResolvedFile)
    dependencies.add("mappings", fmlMCPMappings())
    mods {
        "modid" {
            sourceSet sourceSets.main
//            sourceSet sourceSets.client
//            sourceSet sourceSets.server
//            For modules in the 'src' directory, only the main source set is required by default.
        }
    }
    runs {
        client {
            String name = project.username
            String width = project.screen_width
            String height = project.screen_height
            programArgs "--userProperties", "{}", "--username", name, "--session", "a.a.a.a", "--width", width, "--height", height

            // Loom adds -XstartOnFirstThread on macOS for LWJGL 3, but this version runs on
            // LWJGL 2, which drives its own Cocoa event loop. With the flag the process never
            // leaves BackgroundOnly, so the render loop runs while no window is ever shown.
            vmArgs.remove("-XstartOnFirstThread")
        }
//        server {
//            programArgs "--", ""
//        }
    }
}

processResources {
    inputs.properties(
            version: project.version,
            id: project.mod_id,
            name: project.mod_name
    )

    filesMatching("fml.mod.json") {
        expand(inputs.properties)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    // Loom automatically attaches sourcesJar to remapSourcesJar and the build lifecycle when it is present.
    // Remove this line only when source artifacts should not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// The game must run on Java 17: the Mixin build bundled with FishModLoader uses an ASM
// that cannot read class files newer than Java 17. It must also match the architecture of
// the natives installed above, which Gradle's toolchain selection cannot express: it filters
// on version and vendor only, so with both an x86_64 and an arm64 JDK 17 installed it may
// hand out either one. Set game_java_home in ~/.gradle/gradle.properties to override.
def gameJavaHome = useArm64Lwjgl ? findGameJavaHome("arm64") : null

tasks.withType(JavaExec).configureEach {
    if (gameJavaHome != null) {
        executable = new File(gameJavaHome, "bin/java").absolutePath
    } else {
        // Loom finalizes the java extension's toolchain during configuration,
        // so the launcher is pinned per task rather than in the java block.
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

}

/**
 * Finds a Java 17 home for the given architecture, or null to fall back to the toolchain.
 * An explicit game_java_home wins, and is trusted as given rather than probed.
 */
File findGameJavaHome(String architecture) {
    def configured = project.findProperty("game_java_home")
    if (configured) {
        def home = new File(configured.toString())
        if (!new File(home, "bin/java").isFile()) {
            throw new GradleException("game_java_home does not point at a JDK: ${home}")
        }
        return home
    }

    def match = ["${System.getProperty("user.home")}/Library/Java/JavaVirtualMachines",
                 "/Library/Java/JavaVirtualMachines"]
            .collect { new File(it) }
            .findAll { it.isDirectory() }
            .collectMany { (it.listFiles() ?: []) as List }
            .collect { new File(it, "Contents/Home") }
            .find { home ->
                def binary = new File(home, "bin/java")
                if (!binary.isFile() || !javaArchitectures(binary).contains(architecture)) {
                    return false
                }
                def release = new File(home, "release")
                return release.isFile() && release.readLines().any {
                    it.startsWith("JAVA_VERSION=") && it.contains('"17')
                }
            }

    if (match == null) {
        logger.warn("No ${architecture} JDK 17 found, falling back to the Java 17 toolchain. "
                + "If that picks a JVM of another architecture, runClient fails with "
                + "UnsatisfiedLinkError; point game_java_home at a ${architecture} JDK 17.")
    }
    return match
}

/** Returns the architectures the given Mach-O binary was built for. */
List<String> javaArchitectures(File binary) {
    def stdout = new ByteArrayOutputStream()
    def result = exec {
        commandLine "lipo", "-archs", binary.absolutePath
        standardOutput = stdout
        errorOutput = new ByteArrayOutputStream()
        ignoreExitValue = true
    }
    return result.exitValue == 0 ? stdout.toString().trim().split(/\s+/) as List : []
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { String fileName -> "${fileName}_${inputs.properties.archivesName}" }
    }
}

// Configure the Maven publication.
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.maven_id
            from(components.java)
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.

        // ModdedMITE release repository.
        maven {
            name = "ModdedMITE"
            url = uri("https://maven.limingzxc.top/repository/maven-releases/")
            credentials {
                // Read only from gradle.properties (user level, your gradle_home)
                username = project.findProperty("nexusUsername")
                password = project.findProperty("nexusPassword")
            }
        }
    }
}
